
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">
    <h2 class="text-center mb-4">Student Records</h2>

    <input
        type="text"
        id="search"
        class="form-control mb-4"
        placeholder="Search Student"
    >

    <div id="container" class="row g-4"></div>
    <div id="json"></div>
</div>

<script>
const students = [
    { name: "rohit", branch: "CSE", cgpa: 8.4 },
    { name: "priya", branch: "ECE", cgpa: 7.9 },
    { name: "rakshita", branch: "IT", cgpa: 9.1 }
];

let html = "";

students.forEach((student, i) => {
    html += `
        <div class="col-md-4 card-item">
            <div class="card shadow">
                <div class="card-body">
                    <h5>${student.name}</h5>

                    <button class="btn btn-primary btn-sm mt-2"
                        onclick="toggleDetails(${i})">
                        Show Details
                    </button>

                    <div id="details-${i}" class="details mt-3" style="display:none;">
                        <p><strong>Branch:</strong> ${student.branch}</p>
                        <p><strong>CGPA:</strong> ${student.cgpa}</p>
                    </div>
                </div>
            </div>
        </div>
    `;
});

document.getElementById("container").innerHTML = html;
document.getElementById("search").addEventListener("keyup", function () {
    const value = this.value.toLowerCase();
    const cards = document.querySelectorAll(".card-item");

    cards.forEach((card) => {
        const name = card.querySelector("h5").textContent.toLowerCase();

        if (name.includes(value)) {
            card.style.display = "block";
        } else {
            card.style.display = "none";
        }
    });
});

function toggleDetails(index) {
    const details = document.getElementById(`details-${index}`);

    if (details.style.display === "none") {
        details.style.display = "block";
    } else {
        details.style.display = "none";
    }
 }

</script>

</body>
</html>
